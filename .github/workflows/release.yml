name: Release Desktop

# Build and publish the Tauri app for WINDOWS.
# macOS builds are done locally (`just release`) — Apple codesign/notarize needs
# local certs, so it's not run in CI.
# Triggers on a pushed tag like `v0.1.0`, or manually.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json "packageManager"; don't also pass
      # `version` here or action-setup errors with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & publish (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing (minisign)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Frontend build env (Convex prod) — see .env.production
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
          VITE_CONVEX_SITE_URL: ${{ secrets.VITE_CONVEX_SITE_URL }}
        with:
          args: "--target x86_64-pc-windows-msvc"
          tagName: ${{ github.ref_name }}
          releaseName: "B Productive ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          # tauri-action writes latest.json with the windows-x86_64 entry.
          # `just release` then appends the macOS entries to the same file.
