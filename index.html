<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1c1c1c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="B-Kanban" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <title>B-Kanban</title>
    <script>
      // Prevent flash of unstyled content
      (function() {
        const mode = localStorage.getItem('theme-mode') || 'system';
        const accent = localStorage.getItem('theme-accent') || 'amber';
        const isDark = mode === 'dark' ||
          (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) document.documentElement.classList.add('dark');
        document.documentElement.dataset.accent = accent;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // The Vite dev server runs on :5173. Registering the service worker there
      // caches stale bundles and kills HMR, so skip it in dev and actively tear
      // down any SW + caches left over from a previous prod/build run.
      (function () {
        if (!("serviceWorker" in navigator)) return;
        var isDev = location.port === "5173";
        if (isDev) {
          navigator.serviceWorker
            .getRegistrations()
            .then(function (rs) {
              rs.forEach(function (r) {
                r.unregister();
              });
            })
            .catch(function () {});
          if (window.caches) {
            caches.keys().then(function (keys) {
              keys.forEach(function (k) {
                caches.delete(k);
              });
            });
          }
          return;
        }
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function () {});
        });
      })();
    </script>
  </body>
</html>
