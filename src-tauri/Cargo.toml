[package]
name = "bproductive"
version = "1.0.0"
description = "B Productive"
authors = ["Jiří Burdych"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "bproductive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-os = "2.3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tokio = { version = "1", features = ["process", "io-util", "rt", "macros"] }
dirs = "5"
toml_edit = "0.22"

# Desktop-only: updater has no mobile support; window-state is meaningless on a phone.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
